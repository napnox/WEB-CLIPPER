<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Napnox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d14;
      --bg-card: #141420;
      --bg-hover: #1a1a28;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(139,92,246,0.4);
      --text-primary: #f0eeff;
      --text-secondary: #8480a0;
      --text-muted: #4a4860;
      --accent: #8b5cf6;
      --accent-dim: rgba(139,92,246,0.15);
      --accent-glow: 0 0 12px rgba(139,92,246,0.25);
      --cyan: #06b6d4;
      --r: 10px;
    }

    body {
      width: 380px;
      height: 540px;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: #0f0f1c;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 9px; }

    .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: white;
      box-shadow: var(--accent-glow);
      flex-shrink: 0;
    }

    .title-wrap { display: flex; flex-direction: column; gap: 0; }
    .title { font-weight: 700; font-size: 13px; letter-spacing: -0.01em; }
    .subtitle { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .btn-group { display: flex; gap: 4px; }
    .btn {
      width: 30px; height: 30px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--border-hover); color: var(--text-primary); }

    /* ── Tabs ────────────────────────────────────────── */
    .tabs {
      display: flex;
      background: #0f0f1c;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
      padding: 0 14px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.15s ease;
    }

    .tab-btn svg { opacity: 0.5; transition: opacity 0.15s; }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab-btn.active svg { opacity: 1; }
    .tab-btn:hover:not(.active) { color: var(--text-secondary); }

    /* ── Search ──────────────────────────────────────── */
    .search-wrap {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    .search-inner {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-inner:focus-within {
      border-color: var(--border-hover);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .search-inner svg { color: var(--text-muted); flex-shrink: 0; }
    .search-input {
      flex: 1; background: transparent; border: none;
      color: var(--text-primary); font-family: inherit; font-size: 12px;
      padding: 8px 0; outline: none;
    }
    .search-input::placeholder { color: var(--text-muted); }

    /* ── Filters ─────────────────────────────────────── */
    .filters {
      display: flex; gap: 6px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .filter {
      padding: 4px 11px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 11px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      transition: all 0.15s ease;
    }
    .filter:hover { border-color: var(--border-hover); color: var(--text-secondary); }
    .filter.active {
      background: var(--accent-dim);
      border-color: rgba(139,92,246,0.4);
      color: #c4b5fd;
    }

    /* ── Feed ────────────────────────────────────────── */
    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
    }

    .feed::-webkit-scrollbar { width: 3px; }
    .feed::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.2); border-radius: 2px; }

    /* ── Empty state ─────────────────────────────────── */
    .empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 50px 20px; text-align: center; color: var(--text-muted);
    }
    .empty-icon { font-size: 32px; opacity: 0.4; }
    .empty-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .empty-sub { font-size: 11px; line-height: 1.5; }

    /* ── Card ────────────────────────────────────────── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 12px 13px;
      margin-bottom: 7px;
      transition: all 0.15s ease;
      cursor: default;
    }
    .card:hover {
      border-color: var(--border-hover);
      background: var(--bg-hover);
      box-shadow: var(--accent-glow);
    }

    .card-header {
      display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px;
    }
    .card-favicon {
      width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; margin-top: 1px;
    }
    .card-title {
      font-size: 12px; font-weight: 600; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
      line-height: 1.4;
    }
    .card-source {
      font-size: 10px; color: var(--text-muted); margin-bottom: 6px;
      display: flex; align-items: center; gap: 4px;
    }
    .card-dot { width: 3px; height: 3px; background: var(--text-muted); border-radius: 50%; }

    .card-text {
      font-size: 11.5px; color: var(--text-secondary); line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; margin-bottom: 8px;
    }

    /* Highlight card color bar */
    .hl-bar {
      width: 3px; border-radius: 2px; flex-shrink: 0; min-height: 40px;
    }

    .card-actions {
      display: flex; gap: 5px; align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 8px; margin-top: 2px;
    }
    .card-btn {
      padding: 3px 9px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-muted);
      font-size: 10.5px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      transition: all 0.12s ease;
    }
    .card-btn:hover { border-color: var(--border-hover); color: var(--text-primary); background: var(--bg-hover); }
    .card-btn.star-active { color: #f59e0b; border-color: rgba(245,158,11,0.4); background: rgba(245,158,11,0.1); }
    .card-btn.ai-btn { background: var(--accent-dim); border-color: rgba(139,92,246,0.3); color: #c4b5fd; margin-left: auto; }
    .card-btn.ai-btn:hover { background: rgba(139,92,246,0.25); }

    /* ── Footer ──────────────────────────────────────── */
    .footer {
      display: flex; align-items: center; justify-content: center;
      padding: 9px 14px;
      border-top: 1px solid var(--border);
      background: #0f0f1c;
      flex-shrink: 0;
    }
    .footer-link {
      font-size: 11px; color: var(--text-muted);
      background: none; border: none; cursor: pointer; font-family: inherit;
      transition: color 0.15s;
    }
    .footer-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">N</div>
      <div class="title-wrap">
        <span class="title">Napnox</span>
        <span class="subtitle">Research OS</span>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn" id="b-capture" title="Capture selected text (Alt+S)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </button>
      <button class="btn" id="b-refresh" title="Refresh">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
      </button>
      <button class="btn" id="b-dash" title="Open Dashboard">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-clips">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Clips
    </button>
    <button class="tab-btn" id="tab-highlights">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Highlights
    </button>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-inner">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="search" placeholder="Search clips, URLs, titles…" autocomplete="off">
    </div>
  </div>

  <!-- Filters (clips only) -->
  <div class="filters" id="filters-bar">
    <button class="filter active" id="f-all">All</button>
    <button class="filter" id="f-star">⭐ Starred</button>
  </div>

  <!-- Feed -->
  <div class="feed" id="feed">
    <div class="empty" id="empty">
      <div class="empty-icon">📋</div>
      <div class="empty-title">Nothing here yet</div>
      <div class="empty-sub">Select text on any page<br>and press <strong>Alt+S</strong> to capture</div>
    </div>
    <div id="list"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="footer-link" id="b-dash-foot">Open full Dashboard →</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
